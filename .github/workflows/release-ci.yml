name: Release CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version, run checks, and build packages
        run: bash scripts/ci.sh release
      - name: Retain packages, source, and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64-release
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify-packages:
    name: Verify packages (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [debian, kali, fedora, arch, appimage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64-release
          path: dist/release
      - name: Install and exercise the downloaded packages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/package-installation
          bash scripts/check-package-installation.sh '${{ matrix.target }}' dist/release 2>&1 \
            | tee 'target/package-installation/${{ matrix.target }}.log'
      - name: Retain verification log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-verification-${{ matrix.target }}
          path: target/package-installation/${{ matrix.target }}.log
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64-release
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --strict -c SHA256SUMS
      - name: Publish the tested version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --generate-notes \
            --title "Open Music Player ${RELEASE_TAG#v}"
