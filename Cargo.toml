[package]
name = "open-audio-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A native Linux home for music, podcasts, and radio"
homepage = "https://github.com/fossgap/open-audio-player"

[dependencies]
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_8"] }
gst = { package = "gstreamer", version = "0.21.3" }
gst-app = { package = "gstreamer-app", version = "0.21.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.20"
url = "2"
walkdir = "2"
httpdate = "1"
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "macros"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking", "rustls-tls"] }
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
gst-controller = { version = "0.21", package = "gstreamer-controller" }

tempfile = "3"
lofty = "0.24.0"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
